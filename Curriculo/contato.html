      flex: 1;
    }

    .contact-card {
      max-width: 700px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border-radius: 12px;
    }
  </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">

    <a class="navbar-brand fw-bold" href="index.html">

<!-- ================= CONTEÚDO ================= -->

<main class="container py-5">

  <h2 class="text-center mb-4">Entre em Contato</h2>

  <div class="card contact-card p-4">

    <form id="formContato">

      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input
          type="text"
          id="nome"
          class="form-control"
          placeholder="Seu nome"
          required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          placeholder="Seu email"
          required>
      </div>

      <div class="mb-3">
        <label for="mensagem" class="form-label">Mensagem</label>
        <textarea
          id="mensagem"
          class="form-control"
          rows="5"
          placeholder="Escreva sua mensagem"
          required></textarea>
      </div>

      <button type="submit" class="btn btn-success w-100">
        <i class="bi bi-whatsapp"></i> Enviar pelo WhatsApp
      </button>

    </form>

  </div>

</main>

<!-- ================= FOOTER ================= -->

<footer class="bg-dark text-white py-4 mt-auto">

  <div class="container text-center">

    <h5>Contato</h5>

    <p>Email: paulotrabalho.17@gmail.com</p>
    <p>Telefone: (14) 99643-4280</p>

    <div class="d-flex justify-content-center gap-3">

      <a href="https://www.instagram.com/paaulinho.zzx/" target="_blank" class="text-white">
        <i class="bi bi-instagram fs-3"></i>

        <i class="bi bi-github fs-3"></i>

      <a href="https://wa.me/5514996434280?text=Olá%20Paulo%20Assis,%20gostaria%20de%20conversar%20com%20você."
          target="_blank"
           class="text-white fs-3">
        <i class="bi bi-whatsapp"></i>
      </a>

    </div>

  </div>

</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- WhatsApp -->
<script>
document.getElementById('formContato').addEventListener('submit', function(e) {
  e.preventDefault();

  const nome = document.getElementById('nome').value;
  const email = document.getElementById('email').value;
  const mensagem = document.getElementById('mensagem').value;

  const texto =
`Olá Paulo Assis!

Meu nome é ${nome}

Email: ${email}

Mensagem:
${mensagem}`;

  const numero = '5514996434280';

  const url = `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;

  window.open(url, '_blank');
});
</script>

</body>
